[platformio]
default_envs = main, node_01, node_02, node_03

[env:main]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    sandeepmistry/LoRa@^0.8.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DNODE_ID=\"MAIN\"

